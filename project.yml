name: IPTVNeo
options:
  bundleIdPrefix: com.iptvneo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: NO

targets:
  IPTVNeo:
    type: application
    platform: iOS
    sources:
      - path: IPTVNeo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iptvneo.app
        INFOPLIST_FILE: IPTVNeo/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
