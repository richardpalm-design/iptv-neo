name: Build iOS IPA (Free / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Link Node to Global Paths for Xcode
        run: |
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $(which node) /usr/local/bin/node
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sf $(which node) /opt/homebrew/bin/node || true

      - name: Install dependencies
        run: npm install

      - name: Patch Swift Packages for Xcode 16 Compatibility
        run: node scripts/patch-swift.js

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Re-patch Any Native Swift Packages
        run: node scripts/patch-swift.js

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Configure Xcode Projects for Unsigned Build
        run: |
          cd ios
          # Ensure manual signing and disable code signing across all projects & pods
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' {} +

      - name: Build iOS Release App
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="IPTVNeo"
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"

          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED! RECENT ERRORS: ==="
              grep -C 3 -E "error:|fatal error:|Command PhaseScriptExecution failed" xcodebuild.log || tail -n 80 xcodebuild.log
              exit 1
            }

      - name: Package into .ipa
        run: |
          cd ios
          mkdir -p Payload
          APP_FILE=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_FILE"
          
          if [ -z "$APP_FILE" ]; then
            echo "Error: Could not find compiled .app file!"
            exit 1
          fi

          cp -r "$APP_FILE" Payload/
          zip -r ../IPTVNeo.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVNeo-ipa
          path: IPTVNeo.ipa
          retention-days: 14
