name: Build iOS IPA (Free / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Native Project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Build Xcode Archive (No Signing Required)
        run: |
          cd ios
          ls -la
          
          if ls -d *.xcworkspace 1> /dev/null 2>&1; then
            TARGET_FILE=$(ls -d *.xcworkspace | head -n 1)
            FLAG="-workspace"
          else
            TARGET_FILE=$(ls -d *.xcodeproj | head -n 1)
            FLAG="-project"
          fi
          
          SCHEME="IPTVNeo"
          echo "Building with $FLAG: $TARGET_FILE, scheme: $SCHEME"
          
          xcodebuild $FLAG "$TARGET_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r ../IPTVNeo.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVNeo-ipa
          path: IPTVNeo.ipa
          retention-days: 14
