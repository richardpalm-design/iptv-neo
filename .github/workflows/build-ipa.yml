name: Build Native iOS IPA (Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS Release App
        run: |
          set -o pipefail
          xcodebuild build \
            -project IPTVNeo.xcodeproj \
            -scheme IPTVNeo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          APP_FILE=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_FILE"
          
          if [ -z "$APP_FILE" ]; then
            echo "Error: Could not find compiled .app file!"
            exit 1
          fi

          cp -r "$APP_FILE" Payload/
          zip -r IPTVNeo.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVNeo-ipa
          path: IPTVNeo.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "IPTV Neo Latest Build"
          body: |
            ## IPTV Neo iOS Native IPA
            - Förinstallerat Sverige 8K IPTV-konto.
            - Startsida-knapp och infälld navigation.
            - Native AVPlayer & Picture-in-Picture & AirPlay.
            - Installera via **Sideloadly**, **SideStore**, **AltStore** eller **TrollStore**.
          files: IPTVNeo.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
